[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "haltia-kit"
version = "2.0.0"
description = "What the Haltia programs share: questions, settings, sound, photos (GTK 3)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.9"
dependencies = ["PyGObject"]

[project.optional-dependencies]
sound = ["python-mpv"]
media = ["mutagen"]

[project.urls]
Homepage = "https://github.com/haltia-de/kit"

[tool.setuptools]
packages = ["haltia_kit", "b8k_compat"]

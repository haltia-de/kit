[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "b8k-compat"
version = "1.0.2"
description = "What the b8k programs share: questions, settings, sound, photos (GTK 3)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.9"
dependencies = ["PyGObject"]

[project.optional-dependencies]
sound = ["python-mpv"]
media = ["mutagen"]

[project.urls]
Homepage = "https://github.com/trudenboy/b8k-compat"

[tool.setuptools]
packages = ["b8k_compat"]
